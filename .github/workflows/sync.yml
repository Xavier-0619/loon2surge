name: 🔄 可莉插件自动同步

# 每天北京时间 02:00 拉一次可莉插件中心，把 Loon 插件转成 Surge 模块并提交。
# cron 用 UTC，18:00 UTC 正好是次日 02:00（东八区）。
#
# 为什么要重试：上游挂在 Cloudflare 后面，GitHub 托管 runner 的出口 IP 是抽签的。
# 同一个 IP 上三轮都拿不到数据，基本说明这个 IP 被拒了；换一台 runner 就是换 IP。
# 实测上游自己的同款项目，10 次运行里有 2 次是这么失败的，不是代码问题。
# 重试只在失败时发生，正常情况只跑一次。

on:
  schedule:
    - cron: "0 18 * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "运行模式"
        type: choice
        options:
          - 同步并提交
          - 只做连通性自检
        default: 同步并提交
      limit:
        description: "只处理前 N 个插件（0 表示全部，调试用）"
        type: number
        default: 0

permissions:
  contents: write

# 上一轮没跑完时不要叠着跑，排队等它结束
concurrency:
  group: kelee-sync
  cancel-in-progress: false

env:
  GOFLAGS: -trimpath
  CGO_ENABLED: 0

jobs:
  sync:
    name: 📦 同步并转换（第 1 次）
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: 📥 检出仓库
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 🐹 准备 Go 环境
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false

      - name: 🧪 转换器自检
        run: |
          go vet ./...
          go test ./... -count=1

      - name: 🔄 抓取并转换
        uses: ./.github/actions/sync
        with:
          mirror: ${{ vars.KLEE_MIRROR }}
          limit: ${{ inputs.limit }}
          probe: ${{ inputs.mode == '只做连通性自检' }}

  retry:
    name: 🔁 换台 runner 重试（第 2 次）
    needs: [sync]
    # 只在第一台没成功时才换台重跑，成功就到此为止
    # 自检失败也换台重试：一台 runner 一个出口 IP，多试两台才知道是不是运气
    if: always() && needs.sync.result != 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: 📥 检出仓库
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 🔄 抓取并转换
        uses: ./.github/actions/sync
        with:
          mirror: ${{ vars.KLEE_MIRROR }}
          limit: ${{ inputs.limit }}
          probe: ${{ inputs.mode == '只做连通性自检' }}

  retry2:
    name: 🔁 再换一台重试（第 3 次）
    needs: [sync, retry]
    if: always() && needs.sync.result != 'success' && needs.retry.result != 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: 📥 检出仓库
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 🔄 抓取并转换
        uses: ./.github/actions/sync
        with:
          mirror: ${{ vars.KLEE_MIRROR }}
          limit: ${{ inputs.limit }}
          probe: ${{ inputs.mode == '只做连通性自检' }}

  report:
    name: 🩺 汇报结果
    needs: [sync, retry, retry2]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: 🩺 汇总本次运行
        run: |
          first="${{ needs.sync.result }}"
          second="${{ needs.retry.result }}"
          third="${{ needs.retry2.result }}"

          {
            echo ""
            echo "### 🩺 本次运行"
            echo ""
            echo "| 尝试 | 结果 |"
            echo "| --- | --- |"
            echo "| 第 1 台 runner | ${first} |"
            echo "| 第 2 台 runner | ${second} |"
            echo "| 第 3 台 runner | ${third} |"
          } >> "$GITHUB_STEP_SUMMARY"

          if [ "$first" = "success" ] || [ "$second" = "success" ] || [ "$third" = "success" ]; then
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "✅ 本轮同步成功。" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          {
            echo ""
            echo "❌ 三台 runner 都没拿到数据。"
            echo ""
            echo "最常见的原因是这个时段的出口 IP 都被上游拒了（403），不是仓库配置问题。"
            echo "可以过几小时手动重跑一次；想彻底不依赖运气，就在仓库 Variables 里"
            echo "加一个 `KLEE_MIRROR` 指向自己的镜像。"
          } >> "$GITHUB_STEP_SUMMARY"
          exit 1
