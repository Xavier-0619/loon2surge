name: 🛰️ 上游更新监听

# 每周一早上看一次 deanxizian/loon_to_surge 有没有新提交（跳过它自己的产物同步提交）。
# 有新东西就让模型读 diff、往这个仓库里提改动，跑通测试后开一个 PR。
#
# 它只开 PR，从不直接合。三种结局：
#   1. 有改动 → 分支 + PR（测试没过也在标题上标 ⚠️，留着证据比丢掉好）
#   2. 模型判断不需要移植 / 模型出错 → 开 issue 提醒，不产生代码
#   3. 上游没有值得看的提交 → 什么都不做
#
# 用哪个模型（见 tools/upstream_merge.py 的 llm_endpoint）：
#   默认  仓库自带的 GITHUB_TOKEN → GitHub Models，零配置零成本
#   可选  Settings → Secrets 里加 AI_API_KEY 覆盖（兼容 OpenAI 接口）
#         可选 vars AI_BASE_URL（默认 https://api.deepseek.com/v1）、AI_MODEL（默认 deepseek-chat）

on:
  schedule:
    # 每周一 UTC 01:00 = 北京时间 09:00。周一早上开 PR，合进来之后
    # 第二天凌晨的同步就会用上新规则。
    - cron: "0 1 * * 1"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "只检查有没有新提交，不调模型"
        type: boolean
        default: false

permissions:
  contents: write
  pull-requests: write
  issues: write
  # 开完 PR 要主动触发审核流水线
  actions: write
  # 没配 AI_API_KEY 时用自带的 token 调 GitHub Models，没这行会被 403
  models: read

concurrency:
  group: upstream-watch
  cancel-in-progress: false

env:
  GOFLAGS: -trimpath
  CGO_ENABLED: 0
  PYTHONIOENCODING: utf-8

jobs:
  watch:
    name: 🔍 检查上游提交
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: 📥 检出仓库
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 🐹 准备 Go 环境
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false

      - name: 🛰️ 拉上游并挑出新提交
        id: collect
        shell: bash
        run: python3 tools/upstream_merge.py collect

      - name: 😴 没有新东西就跳过后续
        if: steps.collect.outputs.has_new != 'true'
        shell: bash
        run: |
          {
            echo "✅ 上游没有需要看的提交"
            echo ""
            echo "最近检查的提交：\`${{ steps.collect.outputs.head_sha }}\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: 📝 生成给模型的材料
        if: steps.collect.outputs.has_new == 'true'
        shell: bash
        run: python3 tools/upstream_merge.py prompt

      - name: 🧠 让模型判断并生成补丁
        id: merge
        if: steps.collect.outputs.has_new == 'true' && inputs.dry_run != true
        shell: bash
        env:
          AI_API_KEY: ${{ secrets.AI_API_KEY }}
          AI_BASE_URL: ${{ vars.AI_BASE_URL }}
          AI_MODEL: ${{ vars.AI_MODEL }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          # 这一步本身不判失败：无论模型说了什么，后面都要记录进度并给出反馈
          set +e
          python3 tools/upstream_merge.py apply
          echo "code=$?" >> "$GITHUB_OUTPUT"
          exit 0

      - name: 🧾 汇总判断结果
        id: verdict
        if: always() && steps.collect.outputs.has_new == 'true'
        shell: bash
        run: |
          has=$(python3 -c "import json,pathlib; p=pathlib.Path('.upstream-work/result.json'); print('yes' if p.exists() and json.loads(p.read_text(encoding='utf-8')).get('changed') else 'no')")
          echo "has_change=$has" >> "$GITHUB_OUTPUT"
          echo "模型产出的改动：$has"

      - name: 🔨 格式化并跑测试
        id: test
        if: steps.verdict.outputs.has_change == 'yes'
        shell: bash
        run: |
          set +e
          gofmt -w internal main.go 2>/dev/null
          go build ./... > build.log 2>&1
          build_code=$?
          go test ./... > test.log 2>&1
          test_code=$?
          go run . validate --dir surge > validate.log 2>&1
          validate_code=$?

          status="通过"
          if [ $build_code -ne 0 ] || [ $test_code -ne 0 ] || [ $validate_code -ne 0 ]; then
            status="失败"
          fi
          echo "status=$status" >> "$GITHUB_OUTPUT"

          {
            echo ""
            echo "### 🧪 测试结果：$status"
            echo ""
            echo '```'
            tail -30 build.log 2>/dev/null
            tail -30 test.log 2>/dev/null
            tail -10 validate.log 2>/dev/null
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit 0

      - name: 🌿 提交到分支
        id: branch
        if: steps.verdict.outputs.has_change == 'yes'
        shell: bash
        run: |
          # 转换结果变了却没动版本号的话，同步时老模块不会被重转，这份改等于白改
          if quiet_diff=$(git diff -- internal/lpx 2>/dev/null); [ -n "$quiet_diff" ]; then
            if ! printf '%s' "$quiet_diff" | grep -q 'const Version'; then
              echo "⚠️ 改了转换逻辑但没动 \`const Version\`，产物不会重新生成" >> "$GITHUB_STEP_SUMMARY"
            fi
          fi

          date_str=$(TZ=Asia/Shanghai date +%F)
          branch="upstream/merge-$date_str"
          result="ok"
          if [ "${{ steps.test.outputs.status }}" != "通过" ]; then result="failed"; fi

          python3 tools/upstream_merge.py advance \
            --sha "${{ steps.collect.outputs.head_sha }}" \
            --at "$date_str" --result "$result"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B "$branch"
          git add -A
          git commit -m "🤖 融合上游 $date_str（${{ steps.collect.outputs.count }} 个提交）" \
                     -m "上游 HEAD：${{ steps.collect.outputs.head_sha }}"
          git push --force origin "$branch"

          {
            echo "branch=$branch"
            echo "date=$date_str"
            echo "result=$result"
          } >> "$GITHUB_OUTPUT"

      - name: 📬 开 PR 供审核
        if: steps.verdict.outputs.has_change == 'yes'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 tools/upstream_merge.py report \
            --kind pr --status "${{ steps.test.outputs.status }}" \
            --out .upstream-work/pr-body.md

          base_title="🤖 融合上游改动 ${{ steps.branch.outputs.date }}"
          title="$base_title"
          if [ "${{ steps.test.outputs.status }}" != "通过" ]; then
            title="⚠️ [测试未通过] $base_title"
          fi

          gh label create upstream-sync --description "每周上游监听自动生成" 2>/dev/null || true
          gh pr create --title "$title" --body-file .upstream-work/pr-body.md \
            --base main --head "${{ steps.branch.outputs.branch }}" \
            --label upstream-sync --draft 2>/dev/null \
          || gh pr create --title "$title" --body-file .upstream-work/pr-body.md \
            --base main --head "${{ steps.branch.outputs.branch }}" --draft

          {
            echo ""
            echo "### 📬 已开 PR"
            echo ""
            echo "分支：\`${{ steps.branch.outputs.branch }}\`（draft，等你审核）"
            echo ""
            cat .upstream-work/pr-body.md
          } >> "$GITHUB_STEP_SUMMARY"

      - name: 🧑‍⚖️ 触发自动审核
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # 用 github.token 开的 PR 不会自动跑 pull_request 流水线（会停在"需要审批"），
          # 所以这里主动点一下；workflow_dispatch 不受那条限制。
          number=$(gh pr list --head "${{ steps.branch.outputs.branch }}" \
                     --json number --jq '.[0].number // empty')
          if [ -z "$number" ]; then
            echo "::warning::没找到刚开的 PR，跳过自动审核"
            exit 0
          fi
          gh workflow run upstream-review.yml -f "pr=$number"
          {
            echo ""
            echo "### 🧑‍⚖️ 已请求审核 PR #$number"
            echo ""
            echo "审核结果会以评论或 approve 的形式出现在那个 PR 上。"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: 🔔 没有改动时开 issue 提醒
        if: always() && steps.collect.outputs.has_new == 'true' && steps.verdict.outputs.has_change != 'yes'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 tools/upstream_merge.py report \
            --kind issue --sha "${{ steps.collect.outputs.head_sha }}" \
            --out .upstream-work/issue-body.md

          # 同一批提交没处理完时不重复开新 issue，只在原 issue 下补充说明
          existing=$(gh issue list --state open --search "上游有新的提交待评估 in:title" \
                     --json number --jq '.[0].number // empty')
          count="${{ steps.collect.outputs.count }}"

          gh label create upstream-sync --description "每周上游监听自动生成" 2>/dev/null || true
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body-file .upstream-work/issue-body.md
            echo "已在 issue #$existing 下补充说明" >> "$GITHUB_STEP_SUMMARY"
          else
            gh issue create --title "🛰️ 上游有 $count 个新的提交待评估" \
              --body-file .upstream-work/issue-body.md --label upstream-sync 2>/dev/null \
            || gh issue create --title "🛰️ 上游有 $count 个新的提交待评估" \
              --body-file .upstream-work/issue-body.md
          fi
