name: 同步插件并转换
description: 拉取可莉插件中心的 Loon 插件、转换成 Surge 模块，有变更就提交推送

# 抽成 composite action 的原因：抓取能不能成，取于这台 runner 的出口 IP 有没有被
# Cloudflare 拒。失败时整份流程要换一台 runner 再跑一遍，步骤不能写两遍。

inputs:
  mirror:
    description: 可选镜像前缀，官方站被拒时按同路径回退
    required: false
    default: ""
  limit:
    description: 只处理前 N 个插件，0 表示全部（调试用）
    required: false
    default: "0"
  probe:
    description: 只做上游连通性自检，不落盘
    required: false
    default: "false"

runs:
  using: composite
  steps:
    - name: 🐹 准备 Go 环境
      uses: actions/setup-go@v5
      with:
        go-version-file: go.mod
        cache: false

    - name: 🔨 编译转换器
      shell: bash
      run: go build -o bin/loon2surge .

    - name: 📡 上游连通性自检
      if: inputs.probe == 'true'
      shell: bash
      env:
        KLEE_MIRROR: ${{ inputs.mirror }}
      run: ./bin/loon2surge sync --probe

    - name: 🔄 拉取插件并转换
      if: inputs.probe != 'true'
      shell: bash
      env:
        KLEE_MIRROR: ${{ inputs.mirror }}
        LIMIT: ${{ inputs.limit }}
      run: |
        set -o pipefail
        # --fetcher auto：有 python3 就借它的 OpenSSL TLS 栈下载（Cloudflare 认指纹），
        # 没有才退回 Go 原生。并发压在 4，避免在 Cloudflare 面前形成突发。
        # --commit-file：让程序把"改了哪些模块 + 可莉更新时间"写成提交信息，shell 拼不出来
        ARGS="--fetcher auto --jobs 4 --delay 0.15 --commit-file $RUNNER_TEMP/commit-msg.txt"
        case "$LIMIT" in
          ""|0) ;;
          *) ARGS="$ARGS --limit $LIMIT" ;;
        esac
        ./bin/loon2surge sync $ARGS | tee sync.log

    - name: 📊 汇总仓库现状
      if: inputs.probe != 'true'
      shell: bash
      run: |
        plugins=$(find loon -name '*.lpx' 2>/dev/null | wc -l)
        modules=$(find surge -name '*.sgmodule' 2>/dev/null | wc -l)
        channel=$(grep -m1 '下载通道' sync.log 2>/dev/null | sed 's/^下载通道：//' || true)
        {
          echo ""
          echo "### 📊 仓库现状"
          echo ""
          echo "| 项目 | 数量 |"
          echo "| --- | --- |"
          echo "| 🧩 Loon 插件 | $plugins |"
          echo "| 📦 Surge 模块 | $modules |"
          echo "| 🔌 下载通道 | ${channel:-未知} |"
        } >> "$GITHUB_STEP_SUMMARY"

    - name: 🚀 提交并推送
      if: inputs.probe != 'true'
      shell: bash
      run: |
        MSG="$RUNNER_TEMP/commit-msg.txt"

        git add -A
        if git diff --cached --quiet; then
          echo "✅ 上游没有变化，本轮不提交" >> "$GITHUB_STEP_SUMMARY"
          exit 0
        fi

        # 提交信息由 loon2surge 生成：标题是北京日期，正文列出新增/更新/删除的模块
        # 和可莉那边的时间。程序没写出来（例如提前失败）就退回一句话，别让推送卡住。
        if [ ! -s "$MSG" ]; then
          printf '🔄 自动更新 %s\n\n本轮有插件变更\n' "$(TZ=Asia/Shanghai date +%F)" > "$MSG"
        fi

        git config user.name "github-actions[bot]"
        git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
        git commit -F "$MSG"
        git push

        {
          echo "🚀 已推送：\`$(head -n1 "$MSG")\`"
          echo ""
          echo '```'
          sed -n '3,$p' "$MSG" | head -30
          echo '```'
        } >> "$GITHUB_STEP_SUMMARY"
